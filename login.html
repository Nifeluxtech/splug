<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPLUG — Sign in</title><link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-mode="login">
  <header class="topbar"></header>
  <main class="container"><section class="card auth-card">
    <span class="eyebrow">Welcome back</span><h1>Sign in to SPLUG</h1><p class="muted" style="margin-bottom:22px">Pick a route, see your price, and receive your OTP without exposing your personal number.</p>
    <form id="authForm">
      <label>Email<input name="email" type="email" required placeholder="you@example.com" /></label>
      <label>Password<input name="password" type="password" required placeholder="Your password" /></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p class="muted" style="margin-top:20px;text-align:center">New to SPLUG? <a href="/register.html">Create an account</a></p>
  </section></main><footer class="site-footer">Need an account? <a href="/register.html">Create one free</a>.</footer>
  <script src="/assets/js/common.js"></script><script src="/assets/js/auth.js"></script>
</body>
</html>
