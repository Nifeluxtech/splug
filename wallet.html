<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SPLUG — Wallet</title><link rel="stylesheet" href="/assets/css/style.css" /></head>
<body><header class="topbar"></header>
<main class="container">
  <div class="page-heading"><span class="eyebrow">Your money, in one place</span><h1>Wallet</h1><p class="muted">Fund your balance before you buy. Every purchase shows its exact price first.</p></div>
  <section class="card center"><p class="muted">Available balance</p><h1 id="balanceAmount" style="font-size:2.6rem;margin-top:7px">₦0.00</h1></section>
  <div class="grid-2">
    <section class="card"><span class="eyebrow">Add funds</span><h2 style="margin:8px 0 16px">Fund wallet</h2><form id="depositForm"><label>Amount (₦) — minimum 1,000<input id="depositAmount" type="number" min="1000" step="50" required placeholder="e.g. 2,000" /></label><button class="btn btn-primary" type="submit">Pay via Afrstar</button></form></section>
    <section class="card"><span class="eyebrow">Cash out</span><h2 style="margin:8px 0 16px">Withdraw to bank</h2><form id="withdrawForm"><label>Amount (₦) — minimum 1,000<input id="withdrawAmount" type="number" min="1000" step="100" required /></label><label>Bank code<input id="bankCode" required placeholder="e.g. 058" /></label><label>Account number<input id="accountNumber" required inputmode="numeric" /></label><label>Account name<input id="accountName" required /></label><button class="btn btn-primary" type="submit">Withdraw</button></form></section>
  </div>
  <section class="card"><div class="selection-head"><div><span class="eyebrow">Ledger</span><h2 style="margin-top:6px">Recent transactions</h2></div><a class="btn btn-ghost btn-sm" href="/history.html">View history</a></div><div id="txnList"><p class="muted">Loading…</p></div></section>
</main><script src="/assets/js/common.js"></script><script src="/assets/js/wallet.js"></script></body></html>
