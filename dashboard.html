<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPLUG — Dashboard</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/index.html">⚡ S<span>PLUG</span></a>
    <div class="balance-chip" id="balanceChip" hidden>₦0.00</div>
  </header>

  <main class="container">
    <section class="card">
      <h2 style="margin-bottom:16px;">Get a number</h2>
      <div class="grid-2">
        <label>Service
          <input id="serviceFilter" placeholder="Search service… e.g. WhatsApp" />
          <select id="serviceSelect" size="1"></select>
        </label>
        <label>Country
          <select id="countrySelect"></select>
        </label>
      </div>
      <button class="btn btn-primary" id="buyBtn" style="margin-top:8px;">Purchase number</button>
      <p class="muted" style="margin-top:10px;">
        Price is charged to your naira wallet. Cancel an unused number and get an instant refund.
      </p>
    </section>

    <section class="card" id="orderCard" hidden>
      <div class="order-head">
        <h3 id="orderService">—</h3>
        <span class="badge" id="orderStatus">Pending</span>
      </div>
      <div class="number-box">
        <span id="orderNumber">—</span>
        <button id="copyNumber">Copy</button>
      </div>
      <p class="muted">Waiting for SMS… keep this page open. The OTP appears automatically.</p>
      <div class="otp-box" id="otpBox" hidden>
        <span id="otpCode">—</span>
        <button id="copyOtp">Copy OTP</button>
      </div>
      <button class="btn btn-danger" id="cancelBtn" style="margin-top:14px;">Cancel order (refund)</button>
      <p class="muted" style="margin-top:12px;">
        Full history lives on the <a href="/history.html">history page</a>.
      </p>
    </section>
  </main>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
